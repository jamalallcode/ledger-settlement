<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ledger - Settlement Register</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tableSticky.css">
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        scroll-behavior: smooth;
        background-color: #ffffff;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Global Custom Scrollbar Styles */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        transition: all 0.3s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* For Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }

      /* Premium Highlight Animation for Date Picker */
      @keyframes premium-pulse-highlight {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
        50% { transform: scale(1.15); box-shadow: 0 0 15px 5px rgba(37, 99, 235, 0.2); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
      }

      .animate-premium-pulse {
        animation: premium-pulse-highlight 2s infinite ease-in-out;
      }

      /* Notification Scale Animation (Small to Large) */
      @keyframes notif-scale-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
      }

      .animate-notif-scale {
        animation: notif-scale-pulse 1.5s infinite ease-in-out;
      }

      /* পেজ ট্রানজিশন এনিমেশন - ল্যান্ডিং/হোম পেজের জন্য (Premium Reveal) */
      @keyframes landing-dashboard-entrance {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }

      /* পেজ ট্রানজিশন এনিমেশন - রেজিস্টার পেজের জন্য */
      @keyframes premium-entrance {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      /* পেজ ট্রানজিশন এনিমেশন - রিটার্ণ পেজের মেইন কন্টেইনার */
      @keyframes report-reveal {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      /* টেবিল স্পেসিফিক এনিমেশন - মাসিক রিটার্ণ টেবিলের জন্য */
      @keyframes table-pop-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .animate-landing-premium {
        animation: landing-dashboard-entrance 0.2s ease-out forwards;
      }

      .animate-premium-page {
        animation: premium-entrance 0.2s ease-out forwards;
      }

      .animate-report-page {
        animation: report-reveal 0.2s ease-out forwards;
      }

      .animate-table-entrance {
        animation: table-pop-in 0.2s ease-out forwards;
      }

      /* টেবিল কন্টেইনার */
      .table-container {
        position: relative;
        width: 100%;
        max-width: 100%;
        overflow: visible !important;
        -webkit-overflow-scrolling: touch;
      }

      /* Force table to fit at 100% zoom on desktop/laptop */
      @media (min-width: 1280px) {
        .table-container {
          overflow: visible !important;
        }
        .table-container table {
          table-layout: fixed !important;
          width: 100% !important;
        }
      }

      table {
        border-collapse: separate !important;
        border-spacing: 0 !important;
        width: 100%;
        table-layout: fixed;
      }

      .resizer { position: absolute; right: 0; top: 0; height: 100%; width: 6px; cursor: col-resize; z-index: 120; }
      .resizer:hover, .resizer.resizing { background: #3b82f6 !important; }

      @media print {
        .no-print { display: none !important; }
        .table-container { overflow: visible !important; }
      }
    </style>
    <script type="application/javascript">
      window.process = { env: { API_KEY: '' } };
      // Suppress Web Vitals / INP performance overlay popups
      if (typeof window !== 'undefined') {
        const suppressINP = () => {
          document.querySelectorAll('div').forEach(el => {
            if (el.textContent && el.textContent.includes('INP Issue') && el.textContent.includes('Event handlers')) {
              el.style.setProperty('display', 'none', 'important');
              el.remove();
            }
          });
        };
        const inpObserver = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === 1) {
                const el = node as HTMLElement;
                if (el.textContent && el.textContent.includes('INP Issue')) {
                  el.style.setProperty('display', 'none', 'important');
                  setTimeout(() => el.remove(), 0);
                }
              }
            }
          }
        });
        window.addEventListener('DOMContentLoaded', () => {
          inpObserver.observe(document.body, { childList: true, subtree: true });
          setInterval(suppressINP, 500);
        });
      }
    </script>
  </head>
  <body class="bg-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
